plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    // Compose compiler (task tefal2garmin-on1): version matches the Kotlin
    // compiler behind AGP 9's built-in Kotlin (KGP 2.2.10). No
    // org.jetbrains.kotlin.android here — AGP 9 provides Kotlin compilation.
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.zamotkin.extrahealthgarmin'
    // connect-client 1.1.0 AAR metadata requires compileSdk 36 (work 2.12.0
    // needs 35 — subsumed). targetSdk stays 34: runtime opt-in is a separate,
    // deliberate decision (Strangler phase 2a note).
    compileSdk 36
    
    defaultConfig {
        applicationId "com.zamotkin.extrahealthgarmin"
        // Health Connect era (Strangler phase 2a): connect-client targets
        // modern Android only, so the floor moves from 21 to 26.
        minSdk = 26
        targetSdk = 34
        versionCode 5
        versionName "2.2.0-omron-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        // Required for the BuildConfig fields above (AGP 8+ opt-in).
        buildConfig true
        // Jetpack Compose (UI epic mtf). The compiler plugin itself is
        // org.jetbrains.kotlin.plugin.compose (see plugins block); AGP 9's
        // built-in Kotlin supplies the Kotlin compilation it hooks into.
        compose true
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            // Passwords can be supplied via Gradle properties
            // (-PRELEASE_STORE_PASSWORD=... / -PRELEASE_KEY_PASSWORD=...);
            // the fallback keeps local debug-signing behavior unchanged.
            storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: 'android'
            keyAlias 'release'
            keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        debug {
            // Debug-only credentials for the Garmin DI-auth live spike
            // (garmin-api-import-j5e.1). Declared HERE, not in
            // defaultConfig, so the release BuildConfig does not even carry
            // the fields. Supplied via Gradle properties and consumed by the
            // debug source set's GarminAuthSpike (release links a no-op);
            // blank by default so normal debug builds carry no credentials:
            //   ./gradlew assembleDebug -PGARMINSPIKE_EMAIL=... \
            //     -PGARMINSPIKE_PASSWORD=... [-PGARMINSPIKE_MFA_CODE=...]
            buildConfigField "String", "GARMINSPIKE_EMAIL", "\"${project.findProperty('GARMINSPIKE_EMAIL') ?: ''}\""
            buildConfigField "String", "GARMINSPIKE_PASSWORD", "\"${project.findProperty('GARMINSPIKE_PASSWORD') ?: ''}\""
            buildConfigField "String", "GARMINSPIKE_MFA_CODE", "\"${project.findProperty('GARMINSPIKE_MFA_CODE') ?: ''}\""
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
    
    compileOptions {
        // JVM 11 target: work-runtime 2.12.0 (periodic HC sync, task 2b)
        // ships inline functions compiled at JVM 11, which cannot be inlined
        // into JVM 1.8 bytecode. D8 desugars Java 11 bytecode for minSdk 26.
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            // Robolectric 4.12.1 cannot run on the current JDK (its bundled ASM
            // rejects the runtime's class files), so util classes that call
            // android.util.Log run as plain JUnit with stubbed framework methods.
            returnDefaultValues = true
        }
    }

    // Kotlin is compiled by AGP 9's built-in Kotlin support; its jvmTarget
    // defaults to compileOptions.targetCompatibility above.
}

dependencies {
    implementation "androidx.core:core-ktx:1.9.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Jetpack Compose (UI epic mtf; enabled by task tefal2garmin-on1).
    // BOM 2026.06.01 is the newest line compatible with compileSdk 36:
    // from 2026.08.00 the ui artifacts require minCompileSdk 37.
    // Versions resolved by the BOM: ui/ui-tooling/ui-tooling-preview 1.11.4,
    // material3 1.4.0 (all minCompileSdk 35, min AGP 8.6.0).
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    // Preview annotations are compile-time API — keep on the main classpath
    // so release sources compiling @Preview functions link too.
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // LiveData -> Compose bridging (observeAsState) for the Omron screens.
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Bottom-bar icons for the Omron screen (core set: List/Refresh/Settings).
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    // Interactive preview rendering is debug-only tooling.
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Compose hosting (setContent) + navigation for the Omron blood-pressure
    // screen (epic tefal2garmin-939). navigation 2.9.x is the newest line on
    // compileSdk 36 - from 2.10.0 the artifacts require minCompileSdk 37.
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.8'

    // ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Garmin DI OAuth2 auth client (garmin/ package) — HTTP + tests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Official Garmin FIT SDK — encodes weight_scale files for the
    // upload-service import (plain Java 8 bytecode, minSdk 21 compatible).
    implementation 'com.garmin:fit:21.176.0'

    // Health Connect record reads + change tokens (Strangler phase 2a).
    implementation 'androidx.health.connect:connect-client:1.1.0'

    // WorkManager — periodic Health Connect sync; worker classes land in a
    // later phase, the dependency ships now so the health/ core compiles
    // against the final wiring.
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    // Room — blood-pressure record persistence (omron/data, epic
    // tefal2garmin-939). Compiler runs via KSP (see root build.gradle).
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.robolectric:robolectric:4.12.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // Health Connect test fakes (FakeHealthConnectClient) for health/ tests.
    testImplementation 'androidx.health.connect:connect-testing:1.0.0-alpha04'
    // Real org.json for JVM unit tests — the android.jar stub returns
    // default values (see returnDefaultValues above), which would silently
    // corrupt JSON handling in the garmin/ tests.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
